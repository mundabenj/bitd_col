<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .registration-form {
            max-width: 400px;
            margin: 0 auto;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        input, button {
            width: 100%;
            padding: 10px;
            margin: 5px 0;
            box-sizing: border-box;
            font-size: 1.6em;
            font-family: Arial, sans-serif;
        }
        .field {
            margin-bottom: 12px;
        }
        .error {
            color: red;
            margin: 0;
        }
        .success {
            color: green;
            margin: 0;
        }
    </style>
</head>
<body>
    <form action="" method="post" id="registrationForm" class="registration-form">
        <h2>Registration Form</h2>
        <div class="field">
            <label for="fullname">Full Name:</label><br>
            <input type="text" id="fullname" name="fullname" maxlength="60"><br>
            <p id="fullNameError" class="error"></p>
        </div>
        <div class="field">
            <label for="email">Email:</label><br>
            <input type="email" id="email" name="email"><br>
            <p id="emailError" class="error"></p>
        </div>
        <div class="field">
            <label for="phone">Phone:</label><br>
            <input type="tel" id="phone" name="phone"><br>
            <p id="phoneError" class="error"></p>
        </div>
        <div class="field">
            <label for="password">Password:</label><br>
            <input type="password" id="password" name="password"><br>
            <p id="passwordError" class="error"></p>
        </div>
        <div class="field">
            <label for="confirmPassword">Confirm Password:</label><br>
            <input type="password" id="confirmPassword" name="confirmPassword"><br>
            <p id="confirmPasswordError" class="error"></p>
        </div>
        <button type="submit">Register</button>
        <p id="validation_result" class="success"></p>
    </form>
    <script>
        // JavaScript code for form validation will go here
        // Creat an event listener for form submission
        document.getElementById('registrationForm').addEventListener('submit', function(event) {
            event.preventDefault(); // Prevent the default form submission behavior

            // Clear previous error messages
            document.getElementById('fullNameError').textContent = '';
            document.getElementById('emailError').textContent = '';
            document.getElementById('phoneError').textContent = '';
            document.getElementById('passwordError').textContent = '';
            document.getElementById('confirmPasswordError').textContent = '';
            document.getElementById('validation_result').textContent = '';

            // Flag to track if the form is valid
            let isValid = true;

            // Validate Full Name
            const fullName = document.getElementById('fullname').value.trim();
            if (fullName === '') { // Check if full name is empty
                document.getElementById('fullNameError').textContent = 'Full Name is required.';
                isValid = false;
            } else if (fullName.length < 3 || fullName.length > 60) { // Check if full name is between 3 and 60 characters
                document.getElementById('fullNameError').textContent = 'Full Name must be between 3 and 60 characters.';
                isValid = false;
            }else if (!/^[a-zA-Z\s']+$/.test(fullName)) { // Check if full name contains only letters, spaces, and apostrophes
                document.getElementById('fullNameError').textContent = 'Full Name can only contain letters, spaces, and apostrophes.';
                isValid = false;
            }



            if (isValid) {
                document.getElementById('validation_result').textContent = 'Form is valid! Registration successful.';
                document.getElementById('validation_result').className = 'success'; 
                // Here you can also add code to submit the form data to the server if needed
            }else {
                document.getElementById('validation_result').textContent = '';
            }
        });
    </script>
</body>
</html>
