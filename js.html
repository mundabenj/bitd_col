<script>

            },

        },
        Secretary:{

    // Loops in JavaScript
    // Rule repeat action until a certain condition is met i < 5
    // initialize a variable i = 0
    // increment i by 1 in each iteration
    // maximum value of i = 5
    // =================
    // While loop
    // =================
document.write("<h3>While Loop</h3>");
var i = 0; // initialize a variable i to 0
while(i < 5){ // repeat the action until i is less than 5
    document.write("The value of i is: " + i + "<br>"); // print the value of i in each iteration
    i++; // increment i by 1 in each iteration
}

    // =================
    // do While loop
    // =================
document.write("<h3>do While Loop</h3>");
var j = 0; // initialize a variable j to 0
do{ // repeat the action at least once and then check the condition
    document.write("The value of j is: " + j + "<br>"); // print the value of j in each iteration
    j++; // increment j by 1 in each iteration
} while(j < 5); // repeat the action until j is less than 5


    // =================
    // for loop
    // =================
document.write("<h3>for Loop</h3>");
for(var k = 0; k < 5; k++){ // initialize a variable k to 0, repeat the action until k is less than 5, and increment k by 1 in each iteration
    document.write("The value of k is: " + k + "<br>"); // print the value of k in each iteration
}

    // =================
    // array loop
    // =================
document.write("<h3>Array Loop</h3>");
var fruits = ["Apple", "Banana", "Cherry", "Pineapple", "Mango"]; // initialize an array of fruits
for(var l = 0; l < fruits.length; l++){ // initialize a variable l to 0, repeat the action until l is less than the length of the array, and increment l by 1 in each iteration
    document.write("The fruit is: " + fruits[l] + "<br>"); // print the value of the array element in each iteration
}
document.write("<h3>Array Loop New</h3>");
for(var fruit of fruits){ // initialize a variable fruit to the value of each element in the array, and repeat the action for each element in the array
    document.write("The fruit is: " + fruit + "<br>"); // print the value of the array element in each iteration
}
document.write("<h3>Array Loop using forEach</h3>");
fruits.forEach(function(fruit){ // use the forEach method to iterate over each element in the array
    document.write("The fruit is: " + fruit + "<br>"); // print the value of the array element in each iteration
});
</script>


<form action="" method="post">
        <label for="name">Name:</label>

    <select id="day" name="day">
        <script>
            document.write("<option value=''>" + new Date().getDate() + " </option>");
            for(var day = 1; day <= 31; day++){
                if(day == new Date().getDate()){ continue; }
                document.write("<option value='" + day + "'>" + day + "</option>");
            }
        </script>
    </select>
    <select id="month" name="month">
        <script>
            var months = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
            document.write("<option value=''>" + months[new Date().getMonth()] + "</option>");
            for(var month of months){
                if(month == months[new Date().getMonth()]){ continue; }
                document.write("<option value='" + month + "'>" + month + "</option>");
            }
        </script>
    </select>
    <select id="year" name="year">
        <script>
            var currentYear = new Date().getFullYear();
            document.write("<option value=''>" + currentYear + "</option>");
            for(var year = currentYear-1; year >= 1990; year--){
                document.write("<option value='" + year + "'>" + year + "</option>");
            }
        </script>
    </select>
    <br>
    <br>

    <input type="reset" value="Reset">
</form>
